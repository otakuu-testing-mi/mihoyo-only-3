<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihoyo Only 3 - Booth List</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #624e42;
            --accent-color: #a4161a;
            /* Lighter background as requested */
            --bg-color: #fefcf9; 
            --card-bg: #ffffff;
            --text-color: #4a4e69;
        }

        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 0;
        }

        /* Targetting the "Zone" (Header) with Anton/Impact font */
        header h1 {
            font-family: 'Anton', sans-serif; 
            color: var(--accent-color);
            font-size: 4em;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
        }

        header p {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 10px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Card with 3px border and lighter feel */
        .booth-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px 15px;
            text-align: center;
            /* Thick 3px border as requested */
            border: 3px solid var(--accent-color);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
        }

        .booth-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(164, 22, 26, 0.15);
            border-color: #ff4d4d; /* Brightens on hover */
        }

        /* PHOTO POP: Making the image the hero */
        .booth-icon {
            width: 170px; /* Bigger photo */
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 5px solid white;
            outline: 2px solid #eee;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.5s ease;
        }
