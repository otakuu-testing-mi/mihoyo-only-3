<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米哈遊 Mihoyo Only 3 - 參展社團名單</title>
    <style>
        :root {
            --primary-color: #624e42;
            --accent-color: #a4161a;
            --bg-color: #fdfbf7;
            /* Made card-bg a very light cream for a softer look */
            --card-bg: #fffefa; 
            --text-color: #4a4e69;
        }

        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            /* Changed font to Impact */
            font-family: 'Impact', 'Charcoal', sans-serif;
            color: var(--accent-color);
            font-size: 3.5em; /* Slightly larger for Impact impact */
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            margin-top: 0;
            font-weight: bold;
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        /* 卡片樣式 */
        .booth-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.03);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px; /* Reduced side padding */
            text-align: center;
            /* Updated to 3px border with accent color */
            border: 3px solid var(--accent-color);
            position: relative;
        }
