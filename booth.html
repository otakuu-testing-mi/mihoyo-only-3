    <style>
        :root {
            --primary-color: #624e42;
            --accent-color: #a4161a;
            --bg-color: #fdfbf7;
            /* Made card-bg a very light cream for a softer look */
            --card-bg: #fffefa; 
            --text-color: #4a4e69;
        }

        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            /* Changed font to Impact */
            font-family: 'Impact', 'Charcoal', sans-serif;
            color: var(--accent-color);
            font-size: 3.5em; /* Slightly larger for Impact impact */
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            margin-top: 0;
            font-weight: bold;
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        /* 卡片樣式 */
        .booth-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.03);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px; /* Reduced side padding */
            text-align: center;
            /* Updated to 3px border with accent color */
            border: 3px solid var(--accent-color);
            position: relative;
        }

        .booth-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(164, 22, 26, 0.15);
            background: #ffffff;
        }

        /* 頭像樣式 - Visual Pop Focus */
        .booth-icon {
            width: 150px; /* Increased size */
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #eee;
            margin-bottom: 10px;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .booth-card:hover .booth-icon {
            transform: scale(1.08); /* Photo pops out more on hover */
        }

        .booth-name {
            font-family: 'Impact', sans-serif; /* Applied Impact to booth names too */
            font-size: 1.3em;
            letter-spacing: 0.5px;
            color: var(--primary-color);
            margin: 5px 0;
        }

        /* Compact social link */
        .social-link {
            font-size: 0.8em;
            color: var(--accent-color);
            text-decoration: none;
            margin-bottom: 12px;
            display: inline-block;
            background: #fff0f0;
            padding: 4px 12px;
            border-radius: 15px;
            transition: 0.2s;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .social-link:hover {
            background: var(--accent-color);
            color: white;
        }

        .btn-group {
            margin-top: auto;
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.75em;
            font-weight: bold;
            transition: 0.3s;
            flex: 1;
            max-width: 100px;
        }

        .btn-social {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-menu {
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            background: transparent;
        }

        /* 搜尋框 */
        #searchBar {
            width: 90%;
            max-width: 400px;
            padding: 12px 25px;
            margin-bottom: 40px;
            border-radius: 30px;
            border: 3px solid #efe4cb;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchBar:focus {
            border-color: var(--accent-color);
        }
    </style>

    function getSmartLink(rawText) {
        if (!rawText) return "#";
        let str = rawText.trim();
        if (str.startsWith("http")) return str;
        if (str.startsWith("www.")) return "https://" + str;
        if (str.includes(".com") || str.includes(".co")) return "https://" + str;
        str = str.replace(/IG\s*[:：]/i, "").replace(/@/g, "").trim();
        let handle = str.split(" ")[0]; 
        return "https://www.instagram.com/" + handle;
    }

    function getDisplayText(rawText) {
        if (!rawText) return "無";
        let str = rawText.trim();
        if (str.startsWith("http") || str.length > 20) {
            return "SOCIAL MEDIA";
        }
        return "@ " + str.replace(/IG\s*[:：]/i, "").replace(/@/g, "").trim();
    }

    function renderCards(data) {
        const container = document.getElementById('boothContainer');
        container.innerHTML = '';
        
        data.forEach(booth => {
            const imgUrl = booth.icon ? `https://drive.google.com/uc?export=view&id=${booth.icon}` : 'https://via.placeholder.com/150?text=No+Icon';
            
            const card = document.createElement('div');
            card.className = 'booth-card';
            card.innerHTML = `
                <img class="booth-icon" src="${imgUrl}" alt="${booth.name}">
                <div class="booth-name">${booth.name}</div>
                
                <a href="${getSmartLink(booth.social)}" target="_blank" class="social-link">
                    🔗 ${getDisplayText(booth.social)}
                </a>

                <div class="btn-group">
                    <a href="#" class="btn btn-social">社團簡介</a>
                    ${booth.menu ? `<a href="${booth.menu}" class="btn btn-menu" target="_blank">刊物清單</a>` : ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function searchBooth() {
        const input = document.getElementById('searchBar').value.toLowerCase();
        const filteredData = boothData.filter(booth => 
            booth.name.toLowerCase().includes(input)
        );
        renderCards(filteredData);
    }

    window.onload = () => renderCards(boothData);
</script>
